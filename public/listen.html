<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listen · Live Translate</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="start-overlay" id="overlay">
    <div class="box">
      <h2>🎧 Live Translate</h2>
      <p>Choose the language you want to hear<br>აირჩიე ენა, რომელზეც გინდა მოისმინო</p>
      <div class="seg langSeg">
        <button data-lang="en" class="on">🇬🇧 English</button>
        <button data-lang="ka">🇬🇪 ქართული</button>
      </div>
      <div><button class="btn primary" id="startBtn">▶ Start listening / დაწყება</button></div>
      <p style="font-size:13px;margin-top:16px">Use headphones · გამოიყენე ყურსასმენი</p>
    </div>
  </div>

  <div class="wrap">
    <header class="top">
      <h1>🎧 <span id="title">Live translation</span></h1>
      <div class="row">
        <span class="badge" id="lagBadge" title="text → voice delay on this device" hidden>⏱ <span id="lag">0.0</span>s</span>
        <span class="badge" id="conn"><span class="dot"></span><span id="connText">…</span></span>
      </div>
    </header>

    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div class="seg langSeg">
          <button data-lang="en" class="on">English</button>
          <button data-lang="ka">ქართული</button>
        </div>
        <div class="row">
          <div class="seg" id="voiceSeg">
            <button data-voice="f" class="on">♀</button>
            <button data-voice="m">♂</button>
          </div>
          <label class="chk"><input type="checkbox" id="speak" checked> <span id="speakLbl">Voice</span></label>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="caption" id="caption"><span class="placeholder" id="waiting">Waiting for the speaker…</span></div>
    </div>

    <div class="panel">
      <h2 id="histTitle">History</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
  const $ = (id) => document.getElementById(id);
  const UI = {
    en: { title: "Live translation", waiting: "Waiting for the speaker…", hist: "History", voice: "Voice",
          on: "Live", off: "Reconnecting…" },
    ka: { title: "ლაივ თარგმანი", waiting: "ველოდებით სპიკერს…", hist: "ისტორია", voice: "ხმა",
          on: "ლაივ", off: "ხელახლა უკავშირდება…" },
  };
  const CAPTION_CHARS = 200;   // rolling caption length
  const MAX_LAG = 8;           // seconds behind the speaker before pieces get skipped

  const store = {
    get(k, d) { try { return localStorage.getItem(k) || d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let myLang = store.get("lt-lang", "en");
  let voice = store.get("lt-voice", "f");
  // utterance id -> { utt, src, dst, source, final, chunks: [{id, text}], preview, ts }
  const utts = new Map();

  // ---------- UI
  function applyLang() {
    document.querySelectorAll(".langSeg button").forEach((b) => b.classList.toggle("on", b.dataset.lang === myLang));
    const t = UI[myLang];
    $("title").textContent = t.title;
    $("histTitle").textContent = t.hist;
    $("speakLbl").textContent = t.voice;
    if ($("waiting")) $("waiting").textContent = t.waiting;
    document.documentElement.lang = myLang;
    render();
  }
  document.querySelectorAll(".langSeg").forEach((seg) => seg.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    myLang = b.dataset.lang; store.set("lt-lang", myLang);
    clearAudio();
    applyLang();
  }));
  $("voiceSeg").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    voice = b.dataset.voice; store.set("lt-voice", voice);
    for (const x of $("voiceSeg").children) x.classList.toggle("on", x === b);
  };
  for (const x of $("voiceSeg").children) x.classList.toggle("on", x.dataset.voice === voice);
  $("speak").onchange = () => { if (!$("speak").checked) clearAudio(); };

  const capitalize = (t) => t.charAt(0).toUpperCase() + t.slice(1);

  // What this listener reads for an utterance: the translation, or the original
  // when they picked the speaker's own language.
  function view(u) {
    if (myLang === u.src) return { done: u.source, tentative: "", original: "" };
    return {
      done: capitalize(u.chunks.map((c) => c.text).join(" ")),
      tentative: u.final ? "" : (u.preview || ""),
      original: u.source,
    };
  }

  function render() {
    const list = [...utts.values()].filter((u) => u.source || u.chunks.length);
    const cap = $("caption");
    if (!list.length) return;

    // rolling caption: the end of the latest utterances, newest piece highlighted
    cap.textContent = "";
    const spans = [];
    let len = 0;
    for (let k = list.length - 1; k >= 0 && len < CAPTION_CHARS; k--) {
      const v = view(list[k]);
      if (v.tentative) spans.unshift(["interim", v.tentative]);
      if (v.done) spans.unshift([k === list.length - 1 ? "speaking" : "", v.done]);
      len += v.done.length + v.tentative.length;
    }
    for (const [cls, text] of spans) {
      const span = document.createElement("span");
      span.className = cls;
      span.textContent = text + " ";
      cap.appendChild(span);
    }

    // history: one item per utterance, newest on top (the log is column-reverse)
    const log = $("log");
    log.textContent = "";
    for (const u of list) {
      const v = view(u);
      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = '<div class="b"></div><div class="a"></div>';
      el.querySelector(".b").textContent = v.done + (v.tentative ? " …" : "");
      el.querySelector(".a").textContent = v.original;
      log.appendChild(el);
    }
  }

  // ---------- audio
  // Each piece is downloaded, decoded, trimmed of leading/trailing silence and played
  // back to back. When pieces pile up, playback speeds up (pitch preserved) to stay live.
  const audio = new Audio();
  audio.preservesPitch = true;
  const clips = [];
  let pumping = false;
  let decodeCtx = null;
  let stopCurrent = null;

  function decode(buf) {
    if (!decodeCtx) {
      const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      decodeCtx = new Ctx(1, 1, 24000);
    }
    return new Promise((resolve, reject) => {
      const p = decodeCtx.decodeAudioData(buf, resolve, reject);
      if (p && p.then) p.then(resolve, reject);
    });
  }

  function trimmedWavUrl(ab) {
    const sr = ab.sampleRate, d = ab.getChannelData(0), thr = 0.015;
    let a = 0, b = d.length - 1;
    while (a < d.length && Math.abs(d[a]) < thr) a++;
    while (b > a && Math.abs(d[b]) < thr) b--;
    if (a >= b) return null;
    a = Math.max(0, a - Math.round(0.02 * sr));
    b = Math.min(d.length, b + Math.round(0.07 * sr));
    const n = b - a, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const s = Math.max(-1, Math.min(1, d[a + i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  async function prepare(seg, lang, v) {
    const r = await fetch(`/api/tts?id=${seg.id}&lang=${lang}&voice=${v}`);
    if (!r.ok) throw new Error("tts " + r.status);
    return trimmedWavUrl(await decode(await r.arrayBuffer()));
  }

  function enqueue(seg) {
    const item = { seg, lang: myLang, at: performance.now(), p: prepare(seg, myLang, voice) };
    item.p.catch(() => {});
    clips.push(item);
    pump();
  }

  function clearAudio() {
    for (const c of clips.splice(0)) c.p.then((u) => u && URL.revokeObjectURL(u), () => {});
    audio.pause();
    if (stopCurrent) stopCurrent();
    speechSynthesis.cancel();
  }

  function playUrl(url, rate) {
    return new Promise((resolve) => {
      // (not "pause": changing src fires one, which would cut the previous piece short)
      const done = () => { stopCurrent = null; resolve(); };
      stopCurrent = done;
      audio.onended = audio.onerror = done;
      audio.defaultPlaybackRate = rate;
      audio.src = url;
      audio.playbackRate = rate;
      audio.play().catch(done);
    });
  }

  async function pump() {
    if (pumping) return;
    pumping = true;
    try {
      while (clips.length) {
        const item = clips.shift();
        let url = null, failed = false;
        try { url = await item.p; } catch { failed = true; }
        const lag = (performance.now() - item.at) / 1000;
        const skip = !$("speak").checked || item.lang !== myLang || (lag > MAX_LAG && clips.length);
        if (skip) { if (url) URL.revokeObjectURL(url); continue; }
        $("lag").textContent = lag.toFixed(1);
        $("lagBadge").hidden = false;
        if (failed) { await speakWithBrowser(item.seg.text[item.lang], item.lang); continue; }
        if (!url) continue;
        // 1.0x when we're keeping up, up to 1.35x when pieces are waiting or we're behind
        const rate = Math.min(1.35, 1 + 0.1 * clips.length + (lag > 3 ? 0.1 : 0));
        await playUrl(url, rate);
        URL.revokeObjectURL(url);
      }
    } finally {
      pumping = false;
    }
  }

  // Fallback when the server has no TTS: use a browser voice if one exists for the language.
  function speakWithBrowser(text, lang) {
    return new Promise((resolve) => {
      const v = speechSynthesis.getVoices().find((x) => x.lang.toLowerCase().startsWith(lang));
      if (!v || !text) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = v; u.lang = v.lang; u.onend = u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }

  // ---------- live stream
  function connect() {
    const es = new EventSource("/events");
    es.onopen = () => { $("conn").className = "badge live"; $("connText").textContent = UI[myLang].on; };
    es.onerror = () => { $("conn").className = "badge"; $("connText").textContent = UI[myLang].off; };
    es.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "history") {
        utts.clear();
        for (const u of msg.utterances) utts.set(u.utt, { ...u, preview: "" });
      } else if (msg.type === "source") {
        const u = utts.get(msg.utt) || { utt: msg.utt, chunks: [], preview: "" };
        Object.assign(u, { src: msg.src, dst: msg.dst, source: msg.text, final: msg.final, ts: msg.ts });
        utts.set(msg.utt, u);
        while (utts.size > 100) utts.delete(utts.keys().next().value);
      } else if (msg.type === "chunk") {
        const u = utts.get(msg.utt);
        if (u) u.chunks.push({ id: msg.id, text: msg.text[msg.dst] });
        if ($("speak").checked && msg.dst === myLang) enqueue(msg);
      } else if (msg.type === "preview") {
        const u = utts.get(msg.utt);
        if (u) u.preview = msg.text;
      } else if (msg.type === "clear") {
        utts.clear();
        $("caption").textContent = ""; $("log").textContent = "";
        return;
      } else {
        return;
      }
      render();
    };
  }

  $("startBtn").onclick = () => {
    // unlock audio playback with a user gesture (required on phones)
    audio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
    audio.play().catch(() => {});
    if (navigator.audioSession) navigator.audioSession.type = "playback";
    speechSynthesis.getVoices();
    $("overlay").remove();
    connect();
  };

  applyLang();
  </script>
</body>
</html>
